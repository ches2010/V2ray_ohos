name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 稳定检查：工程结构 + json5/json 语法 + VPN 声明 + 源码打包
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install json5 parser
        run: pip install json5

      - name: Structure & syntax check
        run: python3 scripts/ci_check.py

      - name: Package source zip
        run: zip -r source-package.zip . -x ".git/*" "node_modules/*"

      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: source-package.zip

  # 尽力而为：构建 OHOS Go 工具链并交叉编译 Xray 核心（GOOS=openharmony + TLSDESC）。
  # 参考 popsiclelmlm/Hey 的公开配方（scripts/build_libxray_ohos.sh / docs/harmonyos-go-tls-wall.md）。
  # 失败不应阻塞合并——产物仅作为后续接入 entry/src/main/cpp 的候选 .so。
  build-libxray:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build OHOS Go toolchain (star4277/ohos-go v1.26.5-beta1)
        run: |
          git clone --depth 1 --branch v1.26.5-beta1 https://github.com/star4277/ohos-go.git "$HOME/ohos-go"
          cd "$HOME/ohos-go/src"
          GOROOT_BOOTSTRAP="$(go env GOROOT)" GOTOOLCHAIN=local bash ./make.bash

      - name: Fetch OpenHarmony Native SDK (ohos llvm/clang)
        run: |
          curl -fL --retry 3 -o /tmp/ohos-sdk.tar.gz \
            https://repo.huaweicloud.com/openharmony/os/6.1.1-LTS/ohos-sdk-windows_linux-public.tar.gz
          mkdir -p "$HOME/ohos-sdk" && tar xzf /tmp/ohos-sdk.tar.gz -C "$HOME/ohos-sdk"
          echo "--- sdk layout (top) ---"
          find "$HOME/ohos-sdk" -maxdepth 3 | head -40
          # SDK 包解开后 linux/ 目录下是各组件压缩包（native 为 zip/tar.gz），需二次解压
          CLANG=$(find "$HOME/ohos-sdk" -name "aarch64-unknown-linux-ohos-clang" | head -1)
          if [ -z "$CLANG" ]; then
            # 必须选 linux 目录下的 native 包；windows 包里的 clang 包装脚本在 Linux 上不可执行
            NATIVE_PKG=$(find "$HOME/ohos-sdk" \( -name "native-linux*.zip" -o -name "native-linux*.tar.gz" \) | head -1)
            echo "native sdk package: $NATIVE_PKG"
            test -n "$NATIVE_PKG"
            mkdir -p "$HOME/ohos-native"
            case "$NATIVE_PKG" in
              *.zip) unzip -q "$NATIVE_PKG" -d "$HOME/ohos-native" ;;
              *.tar.gz) tar xzf "$NATIVE_PKG" -C "$HOME/ohos-native" ;;
            esac
            CLANG=$(find "$HOME/ohos-native" -name "aarch64-unknown-linux-ohos-clang" | head -1)
          fi
          echo "clang: $CLANG"
          test -n "$CLANG"
          # 直接导出编译器绝对路径，避免 HOME 拼接层级出错
          echo "OHOS_CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "OHOS_CLANGXX=${CLANG}++" >> "$GITHUB_ENV"

      - name: Build libxray.so (GOOS=openharmony GOARCH=arm64, c-shared)
        run: |
          export PATH="$HOME/ohos-go/bin:$PATH"
          export GOTOOLCHAIN=local
          git clone --depth 1 --branch v26.7.28 https://github.com/XTLS/libXray.git "$HOME/libXray"
          cd "$HOME/libXray"
          CC="$OHOS_CLANG" \
          CXX="$OHOS_CLANGXX" \
          CGO_ENABLED=1 GOOS=openharmony GOARCH=arm64 \
          CGO_CFLAGS="-ftls-model=global-dynamic" \
          go build -trimpath -buildmode=c-shared -o "$GITHUB_WORKSPACE/libxray.so" ./cgo_bridge

      - name: Build libhevsocks5tun.so (hev-socks5-tunnel 2.9.0, pure C)
        run: |
          LLVM_BIN=$(dirname "$OHOS_CLANG")
          SYSROOT=$(find "$HOME/ohos-native" -maxdepth 4 -name sysroot -type d | head -1)
          echo "sysroot: $SYSROOT"
          test -n "$SYSROOT"
          git clone --recursive --depth 1 --branch 2.9.0 https://github.com/heiher/hev-socks5-tunnel.git "$HOME/hev"
          cd "$HOME/hev"
          make clean >/dev/null 2>&1 || true
          make -j4 CC="$OHOS_CLANG" AR="$LLVM_BIN/llvm-ar" RANLIB="$LLVM_BIN/llvm-ranlib" \
            CFLAGS="--target=aarch64-linux-ohos --sysroot=$SYSROOT -fPIC -O2" static
          MAIN_LIB=$(find . -name 'libhev-socks5-tunnel.a' | head -1)
          echo "main lib: $MAIN_LIB"
          test -n "$MAIN_LIB"
          OTHER_LIBS=$(find . -name '*.a' ! -name 'libhev-socks5-tunnel.a' | tr '\n' ' ')
          "$OHOS_CLANG" --target=aarch64-linux-ohos --sysroot=$SYSROOT -fPIC -shared \
            -o "$GITHUB_WORKSPACE/libhevsocks5tun.so" \
            -Wl,--whole-archive "$MAIN_LIB" -Wl,--no-whole-archive $OTHER_LIBS -lpthread

      - name: Sanity-check produced libraries (PT_TLS / TLSDESC / exports)
        run: |
          file libxray.so libhevsocks5tun.so
          readelf -l libxray.so | grep -i TLS || echo "WARN: no PT_TLS"
          readelf -r libxray.so | grep -i TLSDESC || echo "WARN: no TLSDESC relocs"
          nm -D libxray.so | grep -E "CGoInvoke|CGoFree" || echo "WARN: CGo exports not found"
          nm -D libhevsocks5tun.so | grep hev_socks5_tunnel || echo "WARN: hev exports not found"

      - name: Assemble project package with prebuilt cores
        run: |
          mkdir -p entry/libs/arm64-v8a
          cp libxray.so libhevsocks5tun.so entry/libs/arm64-v8a/
          zip -r V2ray_ohos-with-cores.zip . -x ".git/*" "node_modules/*"

      - uses: actions/upload-artifact@v4
        with:
          name: ohos-native-libs-arm64
          path: |
            libxray.so
            libhevsocks5tun.so

      - uses: actions/upload-artifact@v4
        with:
          name: V2ray_ohos-with-cores
          path: V2ray_ohos-with-cores.zip

  # 实验性：在 CI 上用开源 OpenHarmony SDK + hvigor 构建 HAP（无签名，尽力而为）。
  # HarmonyOS SDK（DevEco 专有）无 Linux 版，因此构建前临时把工程目标改为
  # OpenHarmony（仅运行期修改，不提交）。产物为未签名 HAP，仅供验证编译链路。
  build-hap:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup OpenHarmony SDK 5.0.0 (API 12)
        id: sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "5.0.0"
          cache: true
          # hvigor 4.x looks components up under <SDK>/<api-level>/toolchains etc.
          fixup-path: true

      - name: Install hvigor from the OpenHarmony npm registry
        run: |
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"
          npm install @ohos/hvigor@4.0.9 @ohos/hvigor-ohos-plugin@4.0.9 --no-audit --no-fund
          node node_modules/@ohos/hvigor/bin/hvigor.js --version

      - name: Adapt project target to OpenHarmony (temporary, not committed)
        run: |
          # runtimeOS/compileSdkVersion/strictMode 调整 + hvigor-config.json5（hvigor 4.x 要求 modelVersion）
          python3 scripts/adapt_openharmony.py --strip-vpn
          mkdir -p hvigor
          printf '%s\n' \
            '{' \
            '  "modelVersion": "5.0.0",' \
            '  "dependencies": {},' \
            '  "execution": {},' \
            '  "logging": {},' \
            '  "debugging": {},' \
            '  "nodeOptions": {}' \
            '}' > hvigor/hvigor-config.json5
          echo "--- adapted build-profile.json5 ---"
          cat build-profile.json5

      - name: Build unsigned HAP (hvigor assembleHap)
        run: |
          # hvigor 4.x (API 12 era) resolves the SDK via HOS_SDK_HOME / OHOS_BASE_SDK_HOME
          export HOS_SDK_HOME="${{ steps.sdk.outputs.ohos-base-sdk-home }}"
          export OHOS_BASE_SDK_HOME="${{ steps.sdk.outputs.ohos-base-sdk-home }}"
          node node_modules/@ohos/hvigor/bin/hvigor.js assembleHap --mode module \
            -p module=entry@default -p buildMode=debug --stacktrace --no-daemon
          echo "--- hap files ---"
          find entry/build -name "*.hap" || true

      - name: Collect HAP artifact
        run: |
          mkdir -p dist
          find entry/build -name "*.hap" -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: entry-hap-unsigned
          path: dist/*.hap
