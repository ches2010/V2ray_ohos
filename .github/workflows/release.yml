name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source zip
        run: zip -r "V2ray_ohos-${GITHUB_REF_NAME}-src.zip" . -x ".git/*" "node_modules/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "V2ray_ohos-${GITHUB_REF_NAME}-src.zip" \
            --title "V2ray_ohos $GITHUB_REF_NAME" \
            --generate-notes
